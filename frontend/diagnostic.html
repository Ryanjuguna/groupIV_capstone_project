<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Diagnostic Tool | Cancer Prediction</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <main class="container">
        <h1>Medical Diagnostic Input</h1>
        <p>Please enter the patient details below for the Random Forest model to analyze.</p>
        
        <form id="predictionForm" class="medical-form">
            <div class="form-group">
                <input type="text" id="name" placeholder="Patient Name" required>
                <input type="number" id="age" placeholder="Age" required>
            </div>

            <div class="form-group">
                <input type="number" step="0.1" id="tumor_size" placeholder="Tumor Size (cm)" required>
                <input type="number" id="inv_nodes" placeholder="Involved Nodes Count" required>
            </div>

            <div class="form-grid">
                <label>Menopause Status: 
                    <select id="menopause"><option value="1">Yes</option><option value="0">No</option></select>
                </label>
                <label>Side: 
                    <select id="breast"><option value="Left">Left</option><option value="Right">Right</option></select>
                </label>
                <label>Metastasis: 
                    <select id="metastasis"><option value="1">Yes</option><option value="0">No</option></select>
                </label>
                <label>Quadrant: 
                    <select id="breast_quadrant">
                        <option value="Upper outer">Upper outer</option>
                        <option value="Lower outer">Lower outer</option>
                        <option value="Upper inner">Upper inner</option>
                        <option value="Lower inner">Lower inner</option>
                    </select>
                </label>
            </div>

            <button type="submit" class="predict-btn">Generate AI Report</button>
        </form>

        <div id="resultDisplay" class="result-card"></div>
    </main>

    <script>
        // ... (The fetch script from previous step)
    </script>
</body>
</html>
