<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Diagnostic Tool | Cancer Prediction</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* A little extra styling to keep things neat */
        /* panel uses global layout rules from style.css */
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-grid label { display: flex; flex-direction: column; font-weight: bold; }
        .form-grid select { margin-top: 5px; padding: 8px; border-radius: 4px; }
        .predict-btn { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; }
        .predict-btn:hover { background-color: #0056b3; }
        .result-card { margin-top: 30px; padding: 20px; text-align: center; border: 2px dashed #ccc; border-radius: 8px; min-height: 50px; font-size: 1.3rem; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Medical Diagnostic Input</h1>
        <p>Please enter the patient details below for the Random Forest model to analyze.</p>
        
        <form id="predictionForm" class="medical-form">
            <div class="form-group">
                <input type="text" id="name" placeholder="Patient Name" required>
                <input type="email" id="email" placeholder="Patient Email" required> 
                <input type="number" id="age" placeholder="Age" required>
            </div>

            <div class="form-group">
                <input type="number" step="0.1" id="tumor_size" placeholder="Tumor Size (cm)" required>
                <input type="number" id="inv_nodes" placeholder="Involved Nodes Count" required>
            </div>

            <div class="form-grid">
                <label>Menopause Status: 
                    <select id="menopause"><option value="1">Yes</option><option value="0">No</option></select>
                </label>
                <label>Breast Side: 
                    <select id="breast"><option value="Left">Left</option><option value="Right">Right</option></select>
                </label>
                <label>Metastasis: 
                    <select id="metastasis"><option value="1">Yes</option><option value="0">No</option></select>
                </label>
                <label>Breast Quadrant: 
                    <select id="breast_quadrant">
                        <option value="Upper outer">Upper outer</option>
                        <option value="Lower outer">Lower outer</option>
                        <option value="Upper inner">Upper inner</option>
                        <option value="Lower inner">Lower inner</option>
                    </select>
                </label>
                <label>Family History: 
                    <select id="history"><option value="1">Yes</option><option value="0">No</option></select>
                </label>
            </div>

            <button type="submit" class="predict-btn">Generate AI Report</button>
        </form>

        <div id="resultDisplay" class="result-card">Results will appear here...</div>
    </main>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const resultDiv = document.getElementById('resultDisplay');
            resultDiv.innerText = "AI is analyzing data...";
            resultDiv.style.color = "black";

            // 1. Gather data (Now all IDs match the HTML above)
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                age: document.getElementById('age').value,
                menopause: document.getElementById('menopause').value,
                tumor_size: document.getElementById('tumor_size').value,
                inv_nodes: document.getElementById('inv_nodes').value,
                breast: document.getElementById('breast').value,
                metastasis: document.getElementById('metastasis').value,
                breast_quadrant: document.getElementById('breast_quadrant').value,
                history: document.getElementById('history').value
            };

            // 2. Send to Django Backend
            try {
                const response = await fetch('https://breast-cancer-ai-backend.onrender.com/api/predict/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                // 3. Show the result
                if (data.status === "success") {
                    resultDiv.innerText = "AI Analysis Result: " + data.prediction;
                    resultDiv.style.color = data.prediction === "Malignant" ? "#d9534f" : "#5cb85c";
                } else {
                    resultDiv.innerText = "Error: " + data.message;
                }
            } catch (error) {
                resultDiv.innerText = "Connection Error: Is the Django server running?";
            }
        });
    </script>
</body>
</html>
